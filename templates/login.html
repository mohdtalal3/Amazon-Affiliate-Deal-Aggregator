<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Amazon Affiliate Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #16213e;
            border-radius: 12px;
            padding: 40px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .login-card h1 {
            color: #e63c3c;
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .login-card p {
            color: #8892b0;
            text-align: center;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            color: #a0a0c0;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #2a2a4a;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #e63c3c;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #e63c3c;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #c33; }
        .flash {
            background: #3d1520;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Amazon Affiliate</h1>
        <p>Enter your PIN to access the dashboard</p>

        {% with messages = get_flashed_messages(category_filter=["error"]) %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="pin">PIN</label>
                <input type="password" name="pin" id="pin" autofocus placeholder="• • • •" maxlength="10">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</body>
</html>
